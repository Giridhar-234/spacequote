.b.acc{box-shadow:0 6px 16px rgba(246,183,44,.32)}
input,select,textarea{transition:border-color .18s,box-shadow .18s,background .18s;border-radius:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 18%,transparent);background:var(--card)}
.hh{border-radius:26px;background:linear-gradient(120deg,#0b6b60,#07443d 55%,#0d7f72);background-size:200% 200%;animation:hhs 12s ease-in-out infinite alternate}

.qa1:hover,.st1:hover{transform:translateY(-3px);box-shadow:var(--sh2)}

@media (prefers-reduced-motion:reduce){.enter>*,.hh{animation:none!important}}

const IXCSS=`
html body.gate>#ix,html .gate>#ix{display:block!important}
#ix{position:fixed;inset:0;z-index:2000;display:block;background:#020b0a;color:#fff;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;box-sizing:border-box;-webkit-font-smoothing:antialiased}
#ix *{box-sizing:border-box}
#ix .ix-bg{position:absolute;inset:0;background:radial-gradient(75% 60% at 50% 118%,rgba(31,181,159,.62) 0%,rgba(11,107,96,.25) 45%,transparent 75%),radial-gradient(45% 40% at 88% -5%,rgba(246,183,44,.13),transparent 70%),linear-gradient(180deg,#010807 0%,#031614 60%,#06302b 100%)}
#ix .ix-glow{position:absolute;left:50%;bottom:-30vh;width:120vw;height:60vh;margin-left:-60vw;border-radius:50%;background:radial-gradient(closest-side,rgba(58,214,187,.35),transparent);filter:blur(20px);pointer-events:none}
#ix .ix-lt{position:absolute;inset:0;opacity:0;background:radial-gradient(60% 50% at 15% 105%,rgba(31,181,159,.22),transparent 70%),radial-gradient(50% 45% at 90% 100%,rgba(246,183,44,.16),transparent 70%),linear-gradient(180deg,#fbfdfc,#eef6f4);pointer-events:none}
#ix .ix-top{position:absolute;z-index:40;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;align-items:center;gap:14px}
#ix .ix-top img{height:22px;filter:brightness(0) invert(1);opacity:.45;transition:filter .6s,opacity .6s}
#ix .ix-prog{flex:1;display:flex;gap:4px}
#ix .ix-prog i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden;position:relative}
#ix .ix-prog i b{position:absolute;inset:0;background:#7fe0cf;transform-origin:left;transform:scaleX(0)}
#ix .ix-skip{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 14px;font:600 13px "DM Sans",system-ui,sans-serif;cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px)}
#ix.q-light .ix-top img{filter:none;opacity:.6}
#ix.q-light .ix-prog i{background:rgba(16,48,45,.12)}#ix.q-light .ix-prog i b{background:#0b6b60}
#ix.q-light .ix-skip{color:#10302d;border-color:rgba(16,48,45,.25);background:rgba(255,255,255,.6)}
#ix .ix-sc{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3.4vh,34px);padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));perspective:1600px}
#ix .ix-cur{position:absolute;left:0;top:0;width:30px;height:30px;z-index:30;pointer-events:none;transform:translate(-80px,-80px)}
#ix .ix-cur svg{width:30px;height:30px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
#ix .ix-rip{position:absolute;z-index:29;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid #7fe0cf;box-shadow:0 0 18px rgba(127,224,207,.7);pointer-events:none}
#ix .q-hl{margin:0;text-align:center;font:600 clamp(30px,6.2vw,78px)/1.06 Outfit,"DM Sans",system-ui,sans-serif;letter-spacing:-.025em;max-width:min(1100px,94vw);text-wrap:balance}
#ix .q-hl.q-sm{font-size:clamp(24px,4.2vw,50px)}
#ix .q-w{display:inline-block;white-space:pre}
#ix .q-g{background:linear-gradient(92deg,#bff3e8 0%,#5fd6c0 45%,#f6c75a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#ix.q-light .q-hl{color:#0e2a27}
#ix.q-light .q-g{background:linear-gradient(92deg,#0b6b60 0%,#12806f 50%,#c98a0b 100%);-webkit-background-clip:text;background-clip:text}
#ix .q-caret{display:inline-block;width:3px;height:.86em;margin-left:4px;vertical-align:-.06em;background:currentColor;border-radius:2px;animation:qblink 1s steps(1) infinite}
@keyframes qblink{50%{opacity:0}}
#ix .q-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid rgba(127,224,207,.45);background:rgba(127,224,207,.08);color:#bff3e8;font:600 12px "DM Sans",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
#ix .q-tag b{color:#1c1500;background:#f6b72c;border-radius:999px;padding:1px 7px;font-size:10.5px;letter-spacing:.08em}
#ix .q-head{display:flex;flex-direction:column;align-items:center;gap:12px}
/* floating cards (scene 1) */
#ix .q-float{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}
#ix .q-fc{position:absolute;background:#fff;color:#10302d;border-radius:12px;padding:12px 14px;box-shadow:0 24px 60px rgba(0,0,0,.55);font-size:12px;opacity:0;width:clamp(170px,22vw,280px)}
#ix .q-fc b{display:block;font:700 13px "DM Sans",system-ui,sans-serif;margin-bottom:8px}
#ix .q-fc .q-ln{height:7px;border-radius:4px;background:#e4ecea;margin:6px 0}
#ix .q-fc .q-rw{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf2f1;padding:5px 0;color:#355955}
#ix .q-fc.q-dk{background:#0d2522;color:#cfe7e2;border:1px solid rgba(127,224,207,.2)}
#ix .q-fc.q-paper{background:#fffbea;color:#5a4300}
#ix .q-fc.q-paper .q-ln{background:#efe2b5}
@media (max-width:640px){#ix .q-fc.q-hide{display:none}#ix .q-fc.q-r{left:auto!important;right:3%}#ix .q-fc{width:150px;font-size:10.5px;padding:9px 10px}}
/* logo */
#ix .q-logo{height:clamp(56px,11vw,104px);filter:brightness(0) invert(1)}
#ix .q-pill{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(127,224,207,.55);box-shadow:0 0 32px rgba(31,181,159,.45),inset 0 0 18px rgba(127,224,207,.12);font:500 clamp(15px,2.2vw,22px) "DM Sans",system-ui,sans-serif;white-space:nowrap}
#ix .q-pill i{font-style:normal;color:#f6c75a}
/* ===== film v5: one app window that stays on screen ===== */
#ix .q-stage{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vh,28px);width:100%}
#ix .q-hl2{min-height:2.15em;display:flex;align-items:flex-end;justify-content:center}
#ix .q-sub{margin:-6px 0 0;padding:0 10px;color:#9fc9c1;font-size:clamp(13px,1.8vw,17px);text-align:center;max-width:560px;min-height:1.4em}
#ix.q-light .q-sub{color:#587370}
#ix .q-dev{position:relative;width:min(860px,92vw);background:#fff;color:#10302d;border-radius:18px;box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.1),0 0 80px rgba(31,181,159,.3);overflow:hidden;transform-style:preserve-3d}
#ix .q-dh{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid #e6eeec;background:#f7faf9}
#ix .q-dh>i{width:9px;height:9px;border-radius:50%;background:#d7e2df}
